" width="238.5" height="148" rx="14"/><rect class="tile" x="686.3" y="240" width="40" height="40" rx="10"/><svg class="icon" x="694.3" y="248" width="24" height="24" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2" /><circle cx="6" cy="18" r="2" /><line x1="20" y1="4" x2="8.1" y2="15.9" /><line x1="14.5" y1="13.5" x2="20" y2="20" /><line x1="8.1" y1="8.1" x2="12" y2="12" /></svg><text class="title" x="738.3" y="257">Split</text><text class="sub" x="686.3" y="302">One PDF per page, as a zip.</text><rect class="badge" x="686.3" y="334" width="87.8" height="22" rx="6"/><text class="mono" x="695.3" y="349.5">PDF → ZIP</text><text class="heading" x="24" y="436">Chain them: a result opens straight in the next tool</text><text class="sub" x="24" y="501">report.docx</text><path class="edge" d="M116.2 496L144.2 496"/><rect class="key" x="150.2" y="464" width="170.7" height="64" rx="14"/><rect class="tile" x="164.2" y="478" width="36" height="36" rx="10"/><svg class="icon" x="171.4" y="485.2" width="21.6" height="21.6" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /><line x1="9" y1="13" x2="15" y2="13" /><line x1="9" y1="17" x2="13" y2="17" /></svg><text class="title" x="210.2" y="501.5">Office → PDF</text><path class="edge" d="M328.9 496L446.9 496"/><rect class="tag" x="335.3" y="462" width="103.3" height="19" rx="5"/><text class="label" x="386.9" y="476" text-anchor="middle">Continue with</text><text class="mono" x="386.9" y="524" text-anchor="middle">report.pdf</text><rect class="key" x="452.9" y="464" width="170.7" height="64" rx="14"/><rect class="tile" x="466.9" y="478" width="36" height="36" rx="10"/><svg class="icon" x="474.1" y="485.2" width="21.6" height="21.6" viewBox="0 0 24 24"><path d="M8 5l4 4 4-4" /><path d="M8 19l4-4 4 4" /><line x1="4" y1="12" x2="20" y2="12" /></svg><text class="title" x="512.9" y="501.5">Compress</text><path class="edge" d="M631.7 496L749.7 496"/><rect class="tag" x="638" y="4