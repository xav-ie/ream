<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 568" width="1062" height="568" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2b1c12; }
